name: Release to GitHub Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: macos-15-intel
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc

    name: Build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Test Rust core
        run: cargo test

      - name: Build explicit native target
        run: npm run build -- --target ${{ matrix.settings.target }}

      - name: Smoke test packed native binding
        shell: bash
        run: |
          tarball=$(npm pack --silent)
          mkdir package-smoke
          cd package-smoke
          npm init -y >/dev/null
          npm install "../${tarball}" >/dev/null
          node -e "const sdk = require('@sabishii-me/auth-client'); const client = new sdk.SabishiiAuth('https://account.sabishii.me', 'package-smoke'); if (typeof client.requestDeviceCode !== 'function' || typeof client.pollForDeviceToken !== 'function') process.exit(1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: '*.node'
          if-no-files-found: error

  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@sabishii-me'

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p \"require('./package.json').version\")"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy bindings to package root
        run: |
          for dir in artifacts/bindings-*; do
            if [ -d "$dir" ]; then
              cp "$dir"/*.node . 2>/dev/null || true
            fi
          done
          ls -la *.node *.js *.d.ts

      - name: Verify expected bindings
        run: |
          test -f sabishii-auth.linux-x64-gnu.node
          test -f sabishii-auth.darwin-x64.node
          test -f sabishii-auth.darwin-arm64.node
          test -f sabishii-auth.win32-x64-msvc.node

      - name: Update package.json for publishing
        run: |
          node -e "
          const pkg = require('./package.json');
          delete pkg.private;
          pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
          require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
